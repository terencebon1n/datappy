name: frontend
description: "Datappy — real-time public transit departures."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  web_socket_channel: ^3.0.1
  cupertino_icons: ^1.0.8
  flutter_bloc: ^9.1.1
  google_fonts: ^6.2.1
  shared_preferences: ^2.3.0
  geolocator: ^14.0.3
  flutter_map: ^8.3.1
  latlong2: ^0.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  fake_async: ^1.3.1
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/icon/datappy_logo.png

flutter_launcher_icons:
  image_path: "assets/icon/datappy_icon.png"
  remove_alpha_ios: true
  android: "ic_launcher"
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/icon/datappy_foreground.png"
  ios: true
  web:
    generate: true
    image_path: "assets/icon/datappy_icon.png"
    background_color: "#000000"
    theme_color: "#000000"
  windows:
    generate: true
    image_path: "assets/icon/datappy_icon.png"
    icon_size: 256
  macos:
    generate: true
    image_path: "assets/icon/datappy_icon.png"
